[package]
name = "ScrollMPRIS"
version = "2.0.0"
edition = "2024"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.20"
toml = "1.1"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"

[dev-dependencies]
assert_matches = "1.5.0"
