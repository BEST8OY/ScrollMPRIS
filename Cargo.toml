[package]
name = "ScrollMPRIS"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A fast, async, pure Rust scrolling MPRIS module for Waybar"
repository = "https://github.com/BEST8OY/ScrollMPRIS"

[dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.10", features = ["derive"] }
anyhow = "1.0.105"
regex = "1.13.2"
tokio = { version = "1.54.1", features = ["full"] }
thiserror = "2.0.21"
toml = "1.2"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"

[dev-dependencies]
assert_matches = "1.5.0"
