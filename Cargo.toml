[package]
name = "ScrollMPRIS"
version = "1.0.0"
edition = "2024"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
futures-util = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
clap = { version = "4.5.39", features = ["derive"] }
anyhow = "1.0.98"
regex = "1.11.1"
tokio = { version = "1.38.0", features = ["full"] }
thiserror = "1.0.61"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"

[dev-dependencies]
assert_matches = "1.5.0"
